name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: ./build.ps1
      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: dist/picframer.exe
          generate_release_notes: true
